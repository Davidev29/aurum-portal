appId: br.com.aurumbit.desktop
productName: AurumBit Portal
copyright: Copyright (c) 2026 AurumBit Portal
directories:
  output: dist
  buildResources: build
files:
  - dist-electron/**/*
  - out/**/*
  - package.json
  # Segredos e credenciais NUNCA entram no pacote — o .gitignore protege o
  # git, mas o files copia do disco do operador.
  - '!**/.env*'
  - '!**/*.pfx'
  - '!**/*.p12'
  - '!**/*.pvbackup'
  - '!**/*.pem'
  - '!**/*.key'
  - '!**/spike-*.pfx'
  - '!scripts/**'
  - '!tests/**'
  - '!docs/**'
asar: true
npmRebuild: false
asarUnpack:
  - node_modules/better-sqlite3/**/*
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AurumBit Portal
  deleteAppDataOnUninstall: false
  runAfterFinish: true
# Sem bloco `publish`: não existe servidor de atualizações. A checagem manual
# em Configurações permanece disponível para diagnóstico, e falha com erro
# claro enquanto não houver URL real. Adicionar aqui quando for distribuir
# com atualizações automáticas.
